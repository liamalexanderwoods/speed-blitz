<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// =====================================================================
// Basics
// =====================================================================
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, s) => (v < t ? Math.min(t, v + s) : Math.max(t, v - s));
function lerpAngle(a, b, t) {
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return a + d * t;
}
function mulberry(seed) {
  return function () {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const PARAMS = new URLSearchParams(location.search);
const IS_TOUCH = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

const glCanvas = document.getElementById('gl');
const hud = document.getElementById('hud');
const g = hud.getContext('2d');
// Graphics quality, saved in localStorage. Changing it reloads the page (antialias is fixed at startup).
const QUALITY = {
  high: { label: 'HIGH', dpr: 1.5, hudDpr: 2, shadows: true, shadowMap: 2048, treeShadows: true, aa: true },
  medium: { label: 'MEDIUM', dpr: 1, hudDpr: 1, shadows: true, shadowMap: 1024, treeShadows: false, aa: true },
  low: { label: 'LOW', dpr: 0.7, hudDpr: 1, shadows: false, shadowMap: 512, treeShadows: false, aa: false },
};
const QUALITY_ORDER = ['low', 'medium', 'high'];
let qualityKey = 'medium';
try { const q = localStorage.getItem('speedBlitzQuality'); if (QUALITY[q]) qualityKey = q; } catch (e) { /* storage blocked */ }
if (QUALITY[PARAMS.get('q')]) qualityKey = PARAMS.get('q');
const Q = QUALITY[qualityKey];
function setQuality(k) {
  try { localStorage.setItem('speedBlitzQuality', k); } catch (e) { /* storage blocked */ }
  location.reload();
}
let W = innerWidth, H = innerHeight, DPR = 1, hudDPR = 1, dprCap = Q.dpr; // dprCap drops if the game lags

// Town layout: N x N blocks, roads run along the grid lines
const N = 12, CELL = 66, HALF = N * CELL / 2, ROAD = 14;
const gridLine = i => -HALF + i * CELL;
const MPH = 2.237, WALK_SPEED = 13;
const MACH = 767 / MPH, MAX_SPEED = 3 * MACH; // Mach 3, about 2,300 mph
const SPRINT_SPEED = 200 / MPH; // running animation, FOV and speed lines reach full effect here
const MAX_KNOCK = 110; // cap on how fast a super-speed hit can throw things
const FREEZE_MAX = 100;
const ACTIVE = new Set(['walk', 'panic', 'drive', 'chase', 'parked']); // not flying, held, knocked out or gone
const STAR_HEAT = [3, 10, 22, 38, 60]; // heat needed for each wanted star
const COPS_FOR_STARS = [0, 1, 2, 3, 5, 7];
const CAR_HITS = 3; // hits before a car explodes

// =====================================================================
// Renderer / scene
// =====================================================================
// high-performance asks laptops with two graphics chips to use the faster one
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: Q.aa, powerPreference: 'high-performance' });
renderer.shadowMap.enabled = Q.shadows;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const HORIZON = new THREE.Color(0xd4e9ff);
scene.fog = new THREE.Fog(HORIZON, 120, 600);
const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 760);

const sky = new THREE.Mesh(new THREE.SphereGeometry(700, 24, 12), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color(0x3a86de) }, bot: { value: HORIZON.clone() } },
  vertexShader: `varying float vy; void main(){ vy = normalize(position).y; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 top; uniform vec3 bot; varying float vy;
    void main(){ gl_FragColor = vec4(mix(bot, top, pow(clamp(vy, 0.0, 1.0), 0.55)), 1.0);
    #include <colorspace_fragment>
    }`,
}));
sky.renderOrder = -1;
scene.add(sky);

const hemi = new THREE.HemisphereLight(0xd6ecff, 0x5a6b48, 0.95);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6, 2.1);
const HEMI_SKY = new THREE.Color(0xd6ecff), HEMI_GROUND = new THREE.Color(0x5a6b48), SUN_COL = new THREE.Color(0xfff1d6);
const SKY_TOP = new THREE.Color(0x3a86de);
const ICE_SKY = new THREE.Color(0x9fe8ff), ICE_GROUND = new THREE.Color(0x3a5a7a), ICE_SUN = new THREE.Color(0xa8d8ff);
const ICE_FOG = new THREE.Color(0xa8e4ff), ICE_TOP = new THREE.Color(0x2a6aa8);
sun.castShadow = Q.shadows;
sun.shadow.mapSize.set(Q.shadowMap, Q.shadowMap);
Object.assign(sun.shadow.camera, { left: -75, right: 75, top: 75, bottom: -75, near: 1, far: 300 });
sun.shadow.bias = -0.0006;
scene.add(sun, sun.target);

function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, dprCap);
  hudDPR = Math.min(devicePixelRatio || 1, Q.hudDpr);
  renderer.setPixelRatio(DPR);
  renderer.setSize(W, H, false);
  hud.width = Math.round(W * hudDPR); hud.height = Math.round(H * hudDPR);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  vignettes = null;
}
// Screen-edge glows are painted once per resize instead of every frame
let vignettes = null;
function vignette(name, rgb, inner, outer) {
  if (!vignettes) vignettes = {};
  if (!vignettes[name]) {
    const c = document.createElement('canvas');
    c.width = Math.ceil(W / 2); c.height = Math.ceil(H / 2);
    const x = c.getContext('2d'), w = c.width, h = c.height;
    const gr = x.createRadialGradient(w / 2, h / 2, Math.min(w, h) * inner, w / 2, h / 2, Math.max(w, h) * outer);
    gr.addColorStop(0, `rgba(${rgb},0)`); gr.addColorStop(1, `rgba(${rgb},1)`);
    x.fillStyle = gr; x.fillRect(0, 0, w, h);
    vignettes[name] = c;
  }
  return vignettes[name];
}
addEventListener('resize', resize);
resize();

// =====================================================================
// Town
// =====================================================================
function canvasTex(size, paint, repeat) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  paint(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (repeat) t.repeat.set(repeat, repeat);
  return t;
}

// One tile = one block plus half of each road around it
const groundTex = canvasTex(512, (x, s) => {
  const px = s / CELL, r = ROAD / 2 * px, sw = 3 * px;
  x.fillStyle = '#3d4148'; x.fillRect(0, 0, s, s);
  for (let i = 0; i < 2500; i++) {
    x.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.08)';
    x.fillRect(Math.random() * s, Math.random() * s, 2, 2);
  }
  x.fillStyle = '#bdb8ae'; x.fillRect(r, r, s - 2 * r, s - 2 * r);
  x.strokeStyle = 'rgba(0,0,0,0.12)'; x.lineWidth = 1;
  for (let d = r; d < s - r; d += 1.5 * px) {
    x.beginPath(); x.moveTo(d, r); x.lineTo(d, r + sw); x.moveTo(d, s - r - sw); x.lineTo(d, s - r);
    x.moveTo(r, d); x.lineTo(r + sw, d); x.moveTo(s - r - sw, d); x.lineTo(s - r, d); x.stroke();
  }
  x.fillStyle = '#a19d95'; x.fillRect(r + sw, r + sw, s - 2 * (r + sw), s - 2 * (r + sw));
  x.strokeStyle = '#e6e1d8'; x.lineWidth = 3; x.strokeRect(r, r, s - 2 * r, s - 2 * r);
  x.fillStyle = '#f2c94c';
  for (let d = r + px; d < s - r - 2 * px; d += 6 * px) {
    x.fillRect(d, 0, 3 * px, 2); x.fillRect(d, s - 2, 3 * px, 2);
    x.fillRect(0, d, 2, 3 * px); x.fillRect(s - 2, d, 2, 3 * px);
  }
  // crosswalks next to every corner
  x.fillStyle = 'rgba(245,245,240,0.85)';
  const cw = 3.5 * px;
  for (let k = 0; k < r; k += px) {
    x.fillRect(r, k, cw, 0.5 * px); x.fillRect(s - r - cw, k, cw, 0.5 * px);
    x.fillRect(r, s - k - 0.5 * px, cw, 0.5 * px); x.fillRect(s - r - cw, s - k - 0.5 * px, cw, 0.5 * px);
    x.fillRect(k, r, 0.5 * px, cw); x.fillRect(k, s - r - cw, 0.5 * px, cw);
    x.fillRect(s - k - 0.5 * px, r, 0.5 * px, cw); x.fillRect(s - k - 0.5 * px, s - r - cw, 0.5 * px, cw);
  }
}, N);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(N * CELL, N * CELL).rotateX(-Math.PI / 2),
  new THREE.MeshLambertMaterial({ map: groundTex }));
ground.receiveShadow = true;
scene.add(ground);
const grass = new THREE.Mesh(new THREE.PlaneGeometry(5000, 5000).rotateX(-Math.PI / 2),
  new THREE.MeshLambertMaterial({ color: 0x5f9c45 }));
grass.position.y = -0.05;
grass.receiveShadow = true;
scene.add(grass);

const windowTex = canvasTex(128, (x, s) => {
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, s, s);
  x.fillStyle = '#e4e4e4'; x.fillRect(0, s - 8, s, 8);
  const gr = x.createLinearGradient(0, 22, 0, 104);
  gr.addColorStop(0, '#6f9bc4'); gr.addColorStop(1, '#22405f');
  x.fillStyle = '#d9dfe3'; x.fillRect(14, 18, 100, 90);
  x.fillStyle = gr; x.fillRect(19, 23, 90, 80);
  x.fillStyle = 'rgba(255,255,255,0.25)';
  x.beginPath(); x.moveTo(19, 70); x.lineTo(60, 23); x.lineTo(80, 23); x.lineTo(19, 92); x.fill();
  x.fillStyle = '#d9dfe3'; x.fillRect(62, 23, 4, 80);
});

const blockB = Array.from({ length: N * N }, () => []); // buildings by block, for collisions
const parks = [];
const CHUNK = 3, NCH = N / CHUNK; // city mesh is split into NCH x NCH chunks
const bGeos = Array.from({ length: NCH * NCH }, () => []);
let curChunk = 0;
function addBox(cx, cy, cz, w, h, d, col, windows) {
  const geo = new THREE.BoxGeometry(w, h, d);
  geo.translate(cx, cy, cz);
  const uv = geo.attributes.uv, n = uv.count;
  const colors = new Float32Array(n * 3), c = new THREE.Color(col);
  for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) {
    const i = f * 4 + k, roof = f === 2 || f === 3;
    if (!windows || roof) uv.setXY(i, 0.03, 0.03);
    else uv.setXY(i, uv.getX(i) * (f < 2 ? d : w) / 4, uv.getY(i) * h / 3.6);
    const sh = roof ? 0.8 : 1;
    colors[i * 3] = c.r * sh; colors[i * 3 + 1] = c.g * sh; colors[i * 3 + 2] = c.b * sh;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  bGeos[curChunk].push(geo);
}

const treeSpots = [];
{
  const rng = mulberry(20261025);
  const r = (a, b) => a + rng() * (b - a);
  const COLS = [0xe8dcc8, 0xd9c2a0, 0xc96f4a, 0xb85c47, 0x9fb7c9, 0xc8d3dc, 0xe6e6e6, 0x8e9aa6, 0xd4b483, 0xa4c3a2, 0xf0e6d2, 0x7f8c99, 0xe8b9a0];
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const bx = gridLine(i) + CELL / 2, bz = gridLine(j) + CELL / 2;
    const dn = Math.hypot(bx, bz) / (HALF * 1.15);
    curChunk = Math.floor(i / CHUNK) * NCH + Math.floor(j / CHUNK);
    if (rng() < 0.12) {
      parks.push({ bx, bz });
      for (let k = 0; k < 22; k++) treeSpots.push([bx + r(-21, 21), bz + r(-21, 21), r(0.9, 1.5)]);
      continue;
    }
    if (rng() < 0.5) for (let k = -2; k <= 2; k++) {
      treeSpots.push([bx + k * 10, bz - 24.5, 0.8], [bx + k * 10, bz + 24.5, 0.8]);
    }
    const big = rng() < 0.25;
    const lots = big ? [[0, 0, 44]] : [[-12, -12, 20], [12, -12, 20], [-12, 12, 20], [12, 12, 20]];
    for (const [ox, oz, s] of lots) {
      const w = s - r(0, 5), d = s - r(0, 5);
      const h = (r(7, 16) + Math.pow(Math.max(0, 1 - dn), 2) * r(5, 75)) * (big ? 1.2 : 1);
      const cx = bx + ox, cz = bz + oz;
      addBox(cx, h / 2, cz, w, h, d, COLS[Math.floor(rng() * COLS.length)], true);
      addBox(cx, h + 0.4, cz, w + 0.6, 0.8, d + 0.6, 0x9a958d, false); // roof ledge
      if (rng() < 0.7) addBox(cx + r(-w / 4, w / 4), h + 1.6, cz + r(-d / 4, d / 4), r(2, 5), 2.4, r(2, 5), 0x8a8a8a, false);
      blockB[i * N + j].push({ x0: cx - w / 2, x1: cx + w / 2, z0: cz - d / 2, z1: cz + d / 2, h: h + 0.8 });
    }
  }
  const cityMat = new THREE.MeshLambertMaterial({ map: windowTex, vertexColors: true });
  for (const list of bGeos) {
    if (!list.length) continue;
    const city = new THREE.Mesh(mergeGeometries(list), cityMat);
    city.castShadow = city.receiveShadow = true;
    scene.add(city);
  }

  const parkMat = new THREE.MeshLambertMaterial({ color: 0x6cae4f });
  for (const p of parks) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(46, 46).rotateX(-Math.PI / 2), parkMat);
    m.position.set(p.bx, 0.03, p.bz);
    m.receiveShadow = true;
    scene.add(m);
  }

  const trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.25, 0.35, 3, 6).translate(0, 1.5, 0),
    new THREE.MeshLambertMaterial({ color: 0x7a5230 }), treeSpots.length);
  const crowns = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(2.2, 0).translate(0, 4.4, 0),
    new THREE.MeshLambertMaterial({ color: 0xffffff }), treeSpots.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), c = new THREE.Color();
  treeSpots.forEach(([x, z, s], i) => {
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rng() * TAU);
    m.compose(new THREE.Vector3(x, 0, z), q, new THREE.Vector3(s, s, s));
    trunks.setMatrixAt(i, m); crowns.setMatrixAt(i, m);
    crowns.setColorAt(i, c.setHSL(0.26 + rng() * 0.08, 0.5, 0.3 + rng() * 0.12));
  });
  trunks.castShadow = crowns.castShadow = Q.treeShadows;
  scene.add(trunks, crowns);
}

function findBuilding(x, z, pad) {
  const i = Math.floor((x + HALF) / CELL), j = Math.floor((z + HALF) / CELL);
  if (i < 0 || j < 0 || i >= N || j >= N) return null;
  for (const b of blockB[i * N + j]) {
    if (x > b.x0 - pad && x < b.x1 + pad && z > b.z0 - pad && z < b.z1 + pad) return b;
  }
  return null;
}
// Pushes v out of any building wall it is inside (y = its bottom). Returns 'x', 'z' or null.
function collide(v, y, pad) {
  const b = findBuilding(v.x, v.z, pad);
  if (!b || y >= b.h - 0.6) return null;
  const l = v.x - (b.x0 - pad), r = b.x1 + pad - v.x, t = v.z - (b.z0 - pad), d = b.z1 + pad - v.z;
  const m = Math.min(l, r, t, d);
  if (m === l) { v.x = b.x0 - pad; return 'x'; }
  if (m === r) { v.x = b.x1 + pad; return 'x'; }
  if (m === t) { v.z = b.z0 - pad; return 'z'; }
  v.z = b.z1 + pad; return 'z';
}
function groundAt(x, z, y, pad) {
  const b = findBuilding(x, z, pad);
  return b && y >= b.h - 0.6 ? b.h : 0;
}
function sidewalkSpot(far) {
  for (let tries = 0; tries < 30; tries++) {
    const bx = gridLine(Math.floor(Math.random() * N)) + CELL / 2, bz = gridLine(Math.floor(Math.random() * N)) + CELL / 2;
    const a = rand(-24.5, 24.5), s = Math.random() < 0.5 ? -24.5 : 24.5;
    const x = Math.random() < 0.5 ? bx + a : bx + s, z = x === bx + a ? bz + s : bz + a;
    if (!far || Math.hypot(x - hero.pos.x, z - hero.pos.z) > far) return [x, z];
  }
  return [rand(-HALF, HALF), rand(-HALF, HALF)];
}

// =====================================================================
// Hero
// =====================================================================
function buildHero() {
  const grp = new THREE.Group();
  const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.45, metalness: 0.1, ...o });
  const suit = mat(0x1f4fd1), red = mat(0xd61f2c), skin = mat(0xf1c27d), dark = mat(0x1a1a1a);
  const gold = mat(0xffd23f, { emissive: 0x6a4a00 }), white = mat(0xffffff);
  const box = (w, h, d, m) => { const me = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); me.castShadow = true; return me; };
  const legs = [-1, 1].map(s => {
    const piv = new THREE.Group(); piv.position.set(0.14 * s, 0.95, 0);
    const l = box(0.24, 0.6, 0.28, suit); l.position.y = -0.3;
    const boot = box(0.27, 0.38, 0.32, red); boot.position.set(0, -0.76, 0.02);
    piv.add(l, boot); grp.add(piv); return piv;
  });
  const torso = box(0.56, 0.7, 0.32, suit); torso.position.y = 1.3;
  const belt = box(0.58, 0.09, 0.34, gold); belt.position.y = 1.0;
  const disc = new THREE.Mesh(new THREE.CircleGeometry(0.15, 20), white); disc.position.set(0, 1.38, 0.162);
  const sh = new THREE.Shape();
  sh.moveTo(0.04, 0.13); sh.lineTo(-0.07, -0.01); sh.lineTo(0.0, -0.01); sh.lineTo(-0.04, -0.14);
  sh.lineTo(0.08, 0.02); sh.lineTo(0.01, 0.02); sh.lineTo(0.06, 0.13); sh.closePath();
  const bolt = new THREE.Mesh(new THREE.ShapeGeometry(sh), gold); bolt.position.set(0, 1.38, 0.164);
  grp.add(torso, belt, disc, bolt);
  const arms = [-1, 1].map(s => {
    const piv = new THREE.Group(); piv.position.set(0.37 * s, 1.6, 0);
    const a = box(0.18, 0.55, 0.2, suit); a.position.y = -0.27;
    const glove = box(0.22, 0.22, 0.24, red); glove.position.y = -0.62;
    piv.add(a, glove); grp.add(piv); return piv;
  });
  const head = box(0.36, 0.38, 0.36, skin); head.position.y = 1.86;
  const hair = box(0.39, 0.12, 0.39, dark); hair.position.y = 2.08;
  const hairBack = box(0.39, 0.3, 0.08, dark); hairBack.position.set(0, 1.95, -0.16);
  const mask = box(0.38, 0.11, 0.38, red); mask.position.y = 1.9;
  const eyes = [-1, 1].map(s => { const e = box(0.08, 0.05, 0.02, white); e.position.set(0.08 * s, 1.9, 0.19); return e; });
  grp.add(head, hair, hairBack, mask, ...eyes);
  const capeGeo = new THREE.PlaneGeometry(0.62, 1.35, 2, 10).translate(0, -0.675, 0);
  const capeBase = capeGeo.attributes.position.array.slice();
  const cape = new THREE.Group(); cape.position.set(0, 1.62, -0.17);
  const capeMesh = new THREE.Mesh(capeGeo, mat(0xd61f2c, { side: THREE.DoubleSide }));
  capeMesh.castShadow = true;
  cape.add(capeMesh); grp.add(cape);
  grp.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return { grp, legs, arms, cape, capeGeo, capeBase };
}
const heroModel = buildHero();
scene.add(heroModel.grp);

const hero = {
  pos: new THREE.Vector3(0, 0, 0), vel: new THREE.Vector3(), yaw: Math.PI, onGround: true, jumps: 0,
  maxSp: WALK_SPEED, phase: 0, punchCd: 0, punchT: 0, punchArm: 0, blitzCd: 0, slamCd: 0,
  slam: false, lunge: null, blitz: null, held: null, lastMph: 0, hp: 100, hurtT: 0,
};
let camYaw = Math.PI, camPitch = -0.18, shake = 0, camDist = 7;

// =====================================================================
// Townspeople (instanced: one InstancedMesh per body part)
// =====================================================================

const CAR_HALF = 0.88;
function repairCar(car) {

function laneOff(axis, dir) { return axis === 0 ? dir * 3.5 : -dir * 3.5; }
function nextLine(s, dir) { return Math.round((s + HALF) / CELL) + dir; }
function spawnCar(car, far) {
  for (let tries = 0; tries < 20; tries++) {
    car.axis = Math.random() < 0.5 ? 0 : 1;
    car.dir = Math.random() < 0.5 ? 1 : -1;

function updateDrivingCar(car, dt) {
  let s = car.axis === 0 ? car.c.x : car.c.z;
  s += car.dir * car.spd * dt;
  const L = gridLine(car.next);
  if ((s - L) * car.dir >= 0) {
    const atEdge = (car.next >= N - 1 && car.dir > 0) || (car.next <= 1 && car.dir < 0);
    if (atEdge || Math.random() < 0.35) {
      // turn onto the cross street at line `next`
      const along = car.axis === 0 ? car.c.z : car.c.x;
      const opts = [-1, 1].filter(d => { const n = nextLine(along, d); return n >= 1 && n <= N - 1; });
      const nd = pick(opts.length ? opts : [car.dir]);
      car.lineK = car.next;
      car.axis = 1 - car.axis;
      car.dir = nd;
      s = along;
      car.next = nextLine(along, nd);
    } else {
      car.next += car.dir;
    }
  }
  const perp = gridLine(car.lineK) + laneOff(car.axis, car.dir);
  if (car.axis === 0) car.c.set(s, CAR_HALF, perp); else car.c.set(perp, CAR_HALF, s);

  car.q.setFromAxisAngle(UP, yaw);
}

let AC = null, master = null, windGain = null, noiseBuf = null, siren = null, sirenGain = null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.45; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 500; bp.Q.value = 0.6;
    windGain = AC.createGain(); windGain.gain.value = 0;
    src.connect(bp).connect(windGain).connect(master); src.start();
    siren = AC.createOscillator(); siren.type = 'square'; siren.frequency.value = 720;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1600;
    sirenGain = AC.createGain(); sirenGain.gain.value = 0;
    siren.connect(lp).connect(sirenGain).connect(master); siren.start();
  } catch (e) { AC = null; }
}
function tone(f0, f1, dur, type = 'sine', vol = 0.3) {
  if (!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), gn = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(gn).connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq = 1000, type = 'lowpass') {
  if (!AC) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), gn = AC.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(gn).connect(master); s.start(t, Math.random()); s.stop(t + dur + 0.02);
}

let state = PARAMS.has('test') ? 'play' : 'title';

let freezeMix = 0, slowT = 0;
const perf = { show: PARAMS.has('fps'), frames: 0, acc: 0, fps: 0, js: 0, gpu: 0, hud: 0, sJs: 0, sGpu: 0, sHud: 0 };
const keys = {};
let mouseHeld = false;

function resetWorld() {
  for (const p of people) {

  }
  for (const c of cars) {

  }
}
resetWorld();
function resetGame() {
  kos = carsSmashed = combo = bestCombo = heat = stars = calmT = 0;
  frozen = false; freezeE = FREEZE_MAX;
  Object.assign(hero, { held: null, blitz: null, lunge: null, slam: false, maxSp: WALK_SPEED, hp: 100, hurtT: 0, jumps: 0 });
  hero.pos.set(0, 0, 0); hero.vel.set(0, 0, 0);

// ---------- police ----------
function addHeat(n) {
  heat = Math.min(90, heat + n);
  calmT = 0;
}
function updatePolice(dt) {
  if (dt === 0) return;
  calmT += dt;
  if (calmT > 10) heat = Math.max(0, heat - 2 * dt);
  const s = STAR_HEAT.filter(h => heat >= h).length;
  if (s > stars) { starFlash = 2; popup(hero.pos.clone().add(_v.set(0, 3, 0)), s === 1 ? 'WANTED!' : `${s} STARS!`, '#ff4040', 1, 1.4); }
  stars = s;
  const active = police.filter(c => c.state === 'chase' || c.state === 'parked').length;
  dispatchT -= dt;
  if (active < COPS_FOR_STARS[stars] && dispatchT <= 0) {
    const car = police.find(c => c.state === 'gone');
    if (car) { spawnPolice(car); dispatchT = 2.5; }
  }
}
function spawnPolice(car) {
  let x = 0, z = 0;
  for (let tries = 0; tries < 40; tries++) {
    const a = rand(0, TAU), r = rand(110, 170);
    x = clamp(hero.pos.x + Math.sin(a) * r, -HALF + 10, HALF - 10);
    z = clamp(hero.pos.z + Math.cos(a) * r, -HALF + 10, HALF - 10);
    if (!findBuilding(x, z, 3) && Math.hypot(x - hero.pos.x, z - hero.pos.z) > 70) break;
  }
  car.c.set(x, CAR_HALF, z);
  car.yaw = Math.atan2(hero.pos.x - x, hero.pos.z - z);
  car.q.setFromAxisAngle(UP, car.yaw);
  car.vel.set(0, 0, 0); car.w.set(0, 0, 0);
  car.state = 'chase'; car.spd = 20; car.deployed = false;
  car.grp.visible = true; car.grp.scale.setScalar(1);
  repairCar(car);
}
function deployCop(x, z) {
  const p = people.find(p => p.cop && p.state === 'gone');
  if (!p) return;
  p.c.set(x, 1, z);
  p.vel.set(0, 0, 0); p.w.set(0, 0, 0);
  p.state = 'chase'; p.counted = false; p.t = 0; p.shootT = rand(1, 2);
  if (findBuilding(x, z, 0.5)) collide(p.c, 0, 0.5);
}
function updatePoliceCar(car, dt) {
  const dx = hero.pos.x - car.c.x, dz = hero.pos.z - car.c.z, d = Math.hypot(dx, dz);
  if (car.state === 'parked') {
    if (stars === 0 || d > 55) { car.state = 'chase'; car.deployed = false; }
    return;
  }
  let want = Math.atan2(dx, dz), target = d < 16 ? 4 : 38;
  if (stars === 0) {
    want += Math.PI; target = 22;
    if (d > 140) { car.state = 'gone'; car.t = Infinity; car.grp.visible = false; return; }
  }
  let diff = (want - car.yaw) % TAU;
  if (diff > Math.PI) diff -= TAU;
  if (diff < -Math.PI) diff += TAU;
  car.yaw += clamp(diff, -2.4 * dt, 2.4 * dt);
  car.spd = approach(car.spd, target, 22 * dt);
  car.c.x += Math.sin(car.yaw) * car.spd * dt;
  car.c.z += Math.cos(car.yaw) * car.spd * dt;
  if (collide(car.c, 0, 1.4)) { car.yaw += car.side * 2.5 * dt; car.spd *= 0.97; }
  const lim = HALF + 120;
  car.c.x = clamp(car.c.x, -lim, lim); car.c.z = clamp(car.c.z, -lim, lim);
  car.c.y = CAR_HALF;
  car.q.setFromAxisAngle(UP, car.yaw);
  if (stars > 0 && d < 18 && !car.deployed) {
    car.deployed = true; car.state = 'parked';
    const rx = Math.cos(car.yaw), rz = -Math.sin(car.yaw);
    deployCop(car.c.x + rx * 2, car.c.z + rz * 2);
    deployCop(car.c.x - rx * 2, car.c.z - rz * 2);
    popup(car.c.clone().add(_v.set(0, 1.5, 0)), pick(['FREEZE!', 'STOP RIGHT THERE!', 'HANDS UP!']), '#4f8cff', 0.8, 1.3);
  }
  if (car.spd > 15 && d < 2.8 && Math.abs(hero.pos.y - car.c.y) < 2.5) {
    damageHero(12);
    car.spd = 0;
  }
}
function copShoot(p, d) {
  const hs = Math.hypot(hero.vel.x, hero.vel.z);
  const from = p.c.clone().add(_v.set(Math.sin(p.yaw) * 0.55, 0.4, Math.cos(p.yaw) * 0.55));
  const chance = hero.blitz ? 0 : clamp(0.55 - Math.min(1, hs / SPRINT_SPEED) * 0.45 - d / 150, 0.08, 0.6);
  const hit = Math.random() < chance;
  const to = hero.pos.clone().add(_v.set(0, 1.2, 0));
  if (!hit) to.add(_v.set(rand(-3, 3), rand(-1, 2), rand(-3, 3)));
  tracer(from, to);
  burst(from, 3, 0xffcc55, 3, 0.12, 0, 0.1);
  sfx.shot();
  if (hit) damageHero(7);
}
function damageHero(n) {
  if (state !== 'play' || hero.blitz) return;
  hero.hp -= n; hero.hurtT = 3; hurtFlash = 0.35;
  shake = Math.max(shake, 0.25);
  sfx.hurt();
  popup(hero.pos.clone().add(_v.set(0, 2.2, 0)), `-${n}`, '#ff4040', 0.6, 0.7);
  if (PARAMS.has('test')) hero.hp = Math.max(hero.hp, 40);
  if (hero.hp <= 0) {
    hero.hp = 0;
    state = 'busted'; bustedAt = clock;
    mouseHeld = false; frozen = false;
    for (const k in keys) keys[k] = false;
    if (document.pointerLockElement) document.exitPointerLock();
    sfx.busted();
  }
}

function addKO(pos, cop) {
  kos++;
  addHeat(cop ? 3 : 1);
  combo = clock - lastKO < 2.5 ? combo + 1 : 1;
  lastKO = clock;
  bestCombo = Math.max(bestCombo, combo);
  if (combo >= 3) popup(pos.clone().add(_v.set(0, 2, 0)), `x${combo} COMBO!`, '#ff5ac8', 0.8, 1.1);
  panicNear(pos, 30);
}
function panicNear(pos, r) {
  for (const p of people) {
    if ((p.state === 'walk' || p.state === 'panic') && p.c.distanceTo(pos) < r) { p.state = 'panic'; p.t = rand(5, 9); }
  }
}
// Sends a person or car flying. In frozen time they hang in the air until time starts again.
function launch(e, vel, chain = false) {
  if (e.state === 'gone') return;
  if (e === hero.held) hero.held = null;
  e.vel.copy(vel);
  e.w.set(rand(-1, 1), rand(-1, 1), rand(-1, 1)).normalize().multiplyScalar(e.kind === 'car' ? rand(2, 6) : rand(6, 15));
  if (e.kind === 'person' && !e.counted) { e.counted = true; addKO(e.c, e.cop); }
  if (e.kind === 'car' && (ACTIVE.has(e.state) || e.state === 'held')) { carsSmashed++; addHeat(e.police ? 3 : 0.5); panicNear(e.c, 25); }
  e.state = 'fly'; e.t = 0; e.grounded = false;
  if (e.kind === 'car') hurtCar(e, chain);
}
// Each hit makes a car smoke, then burn, then explode. Blasts from other cars light a short fuse
// so chain reactions go off one after another instead of all at once.
function hurtCar(car, chain = false) {
  if (car.exploded || car.state === 'gone') return;
  car.dmg++;
  if (car.dmg >= CAR_HITS) {
    if (chain) { if (!car.fuse) car.fuse = 0.25; } else explode(car);
    return;
  }
  const v = car.dmg === 1 ? 0.75 : 0.5;
  car.mat.color.setRGB(v, v, v);
  burst(car.c, 6, 0x777777, 4, 0.5, -4, 1);
}
function explode(car) {
  car.exploded = true; car.fuse = 0;
  car.mat.color.setHex(0x2a2522);
  if (hero.held === car) hero.held = null;
  const pos = car.c.clone();
  car.state = 'fly'; car.grounded = false; car.t = 0; car.thrown = false;
  car.vel.set(rand(-4, 4), 24, rand(-4, 4));
  car.w.set(rand(-1, 1), rand(-1, 1), rand(-1, 1)).normalize().multiplyScalar(rand(3, 6));
  fireball(pos);
  burst(pos, 40, 0xffb020, 22, 0.9, -4, 0.7);
  burst(pos, 30, 0xff4a10, 16, 0.8, -2, 0.9);
  burst(pos, 25, 0x3a3a3a, 7, 1.2, -6, 2.2);
  burst(pos, 20, 0x222222, 18, 0.35, 25, 1.2);
  ring(pos, 16, 0xffa040, 0.6);
  popup(pos, pick(['KABOOM!', 'KA-BLAM!', 'BOOOOM!']), '#ff7a00', 1.8, 1.2);
  const d = pos.distanceTo(hero.pos);
  shake = Math.max(shake, clamp(1.4 - d / 60, 0.2, 1.4));
  blastFlash = Math.max(blastFlash, clamp(0.6 - d / 200, 0, 0.6));
  sfx.explode();
  addHeat(car.police ? 4 : 2);
  // the blast throws everything nearby, which can set off other damaged cars
  for (const e of everyone) {
    if (e === car || e.state === 'gone' || e.state === 'held') continue;
    const dx = e.c.x - pos.x, dy = e.c.y - pos.y, dz = e.c.z - pos.z, dd = Math.hypot(dx, dy, dz);
    if (dd > 14) continue;
    const f = 1 - dd / 14, m = e.kind === 'car' ? 0.7 : 1;
    const hd = Math.hypot(dx, dz), nx = hd > 0.01 ? dx / hd : rand(-1, 1), nz = hd > 0.01 ? dz / hd : rand(-1, 1);
    launch(e, new THREE.Vector3(nx * 40 * f * m, (16 + 26 * f) * m, nz * 40 * f * m), true);
  }
  if (d < 7 && state === 'play' && !hero.blitz) {
    const hd = Math.hypot(hero.pos.x - pos.x, hero.pos.z - pos.z) || 1;
    hero.vel.x += (hero.pos.x - pos.x) / hd * 25; hero.vel.z += (hero.pos.z - pos.z) / hd * 25;
    hero.vel.y = 14; hero.onGround = false;

  }
}
function impact(pos, big = 1) {
  ring(pos, 4 * big, 0xfff2a8, 0.35);
  burst(pos, Math.round(14 * big), 0xffe066, 14 * big, 0.25, 15, 0.5);
  burst(pos, Math.round(6 * big), 0xffffff, 10 * big, 0.18, 10, 0.4);
  popup(pos, pick(['POW!', 'BAM!', 'WHAM!', 'SMASH!', 'KAPOW!', 'BOOM!', 'THWACK!']), pick(['#ffd23f', '#ff5252', '#4fc3f7', '#ff9800']), big);
  shake = Math.max(shake, 0.35 * big);
  sfx.punch();
}

function aimTarget() {
  const cf = camera.getWorldDirection(_v2), cp = camera.position;
  let best = null, bestScore = Infinity;
  const consider = (e, center) => {
    const hd = Math.hypot(center.x - hero.pos.x, center.z - hero.pos.z);
    if (hd > 34) return;
    _v.subVectors(center, cp);
    const along = _v.dot(cf);
    if (along <= 0) return;
    const perp = _v.addScaledVector(cf, -along).length();
    const ang = Math.atan2(perp, along);
    if (ang < 0.17 || perp < 1.6) {
      const score = ang + hd * 0.004;
      if (score < bestScore) { bestScore = score; best = e; }
    }
  };
  for (const p of people) if (p.state !== 'gone' && p.state !== 'held') consider(p, p.c);
  for (const c of cars) if (c.state !== 'gone' && c.state !== 'held') consider(c, c.c);
  if (best) return best;
  // nothing under the crosshair: anything right in front of the hero
  const fx = Math.sin(hero.yaw), fz = Math.cos(hero.yaw);
  let bd = 3.5;
  for (const e of everyone) {
    if (e.state === 'gone' || e.state === 'held') continue;
    const dx = e.c.x - hero.pos.x, dz = e.c.z - hero.pos.z, d = Math.hypot(dx, dz);
    if (d < bd && (dx * fx + dz * fz) / (d || 1) > 0.3 && Math.abs(e.c.y - hero.pos.y - 1) < 3) { bd = d; best = e; }
  }

}

function punch() {
  if (state !== 'play' || hero.blitz || hero.lunge || hero.punchCd > 0) return;
  hero.punchCd = 0.17; hero.punchT = 0.22; hero.punchArm ^= 1;
  if (hero.held) { throwHeld(); return; }
  const t = aimTarget();
  if (!t) {
    sfx.whoosh();
    const f = camera.getWorldDirection(new THREE.Vector3());
    ring(hero.pos.clone().addScaledVector(f, 2), 1.5, 0xffffff, 0.25);
    return;
  }
  const d = Math.hypot(t.c.x - hero.pos.x, t.c.z - hero.pos.z);
  if (d > 2.4 || Math.abs(t.c.y - hero.pos.y - 1) > 2.5) { hero.lunge = { t, time: 0 }; sfx.whoosh(); }
  else doPunch(t);
}
function doPunch(t) {
  _v.set(t.c.x - hero.pos.x, 0, t.c.z - hero.pos.z);
  if (_v.lengthSq() < 0.01) _v.set(Math.sin(hero.yaw), 0, Math.cos(hero.yaw));
  _v.normalize();
  hero.yaw = Math.atan2(_v.x, _v.z);
  const power = t.kind === 'car' ? 38 : 62;
  const carry = Math.min(1, 60 / (Math.hypot(hero.vel.x, hero.vel.z) || 1)) * 0.5;
  const vel = new THREE.Vector3(_v.x * power + hero.vel.x * carry, t.kind === 'car' ? 16 : 22, _v.z * power + hero.vel.z * carry);
  launch(t, vel);
  impact(t.c, t.kind === 'car' ? 1.4 : 1);
  hero.punchT = 0.22;
}

function startBlitz() {
  if (state !== 'play' || hero.blitz || hero.blitzCd > 0) return;
  const cand = everyone.filter(e => ACTIVE.has(e.state) && e.c.distanceTo(hero.pos) < 85);
  if (!cand.length) { popup(hero.pos.clone().add(_v.set(0, 2, 0)), 'NO TARGETS', '#ffffff', 0.6); return; }
  const list = [];
  let cur = hero.pos.clone();
  while (list.length < 16 && cand.length) {
    let bi = 0, bd = Infinity;
    cand.forEach((e, i) => { const d = e.c.distanceTo(cur); if (d < bd) { bd = d; bi = i; } });
    const e = cand.splice(bi, 1)[0];
    list.push(e); cur = e.c;
  }
  hero.blitz = { list, i: 0, t: 0, from: hero.pos.clone() };
  hero.blitzCd = 3.5;
  hero.lunge = null;
  if (hero.held) { launch(hero.held, new THREE.Vector3(0, 10, 0)); }
  sfx.zap();
}
function updateBlitz(dt) {
  const b = hero.blitz, STEP = 0.075;
  const e = b.list[b.i];
  const to = new THREE.Vector3(e.c.x, Math.max(0, e.c.y - (e.kind === 'car' ? CAR_HALF : 1)), e.c.z);
  b.t += dt;
  const k = Math.min(1, b.t / STEP);
  hero.pos.lerpVectors(b.from, to, k);
  hero.yaw = Math.atan2(to.x - b.from.x, to.z - b.from.z) || hero.yaw;
  if (k >= 1) {
    const a = b.from.clone().add(_v2.set(0, 1.1, 0)), z = to.clone().add(_v2.set(0, 1.1, 0));
    bolt(a, z);
    _v2.set(rand(-1, 1), 0, rand(-1, 1)).normalize();
    launch(e, new THREE.Vector3(_v2.x * 25, e.kind === 'car' ? 22 : 34, _v2.z * 25));
    impact(e.c, 0.8);
    sfx.zap();
    hero.punchT = 0.12; hero.punchArm ^= 1;
    b.from.copy(to);
    b.i++; b.t = 0;
    if (b.i >= b.list.length) {
      hero.blitz = null;
      hero.vel.set(0, 0, 0);
      hero.onGround = false;
      popup(hero.pos.clone().add(_v.set(0, 2.5, 0)), 'SPEED BLITZ!', '#fff27a', 1.2, 1.3);
    }
  }
}

function toggleFreeze() {
  if (state !== 'play') return;
  if (!frozen && freezeE < 15) { popup(hero.pos.clone().add(_v.set(0, 2.5, 0)), 'RECHARGING', '#8fe3ff', 0.6); return; }
  frozen = !frozen;
  if (frozen) { sfx.freeze(); freezeFx = 0.7; } else sfx.unfreeze();
}

function jump() {
  if (state !== 'play' || hero.blitz) return;
  const boost = keys.ShiftLeft || keys.ShiftRight || touch.boost;
  if (hero.onGround) {
    hero.vel.y = boost ? 52 : 30; hero.onGround = false; hero.jumps = 1;
    if (boost) ring(hero.pos, 5, 0xfff2a8, 0.4);
    sfx.jump();
  } else if (hero.jumps < 2) {
    hero.vel.y = 32; hero.jumps = 2;
    ring(hero.pos, 3, 0xffffff, 0.35);
    sfx.jump();
  }
}

function slam() {
  if (state !== 'play' || hero.blitz || hero.slamCd > 0) return;
  hero.slamCd = 1.2;
  if (!hero.onGround) { hero.slam = true; hero.vel.set(hero.vel.x * 0.2, -90, hero.vel.z * 0.2); sfx.whoosh(); }
  else { shockwave(hero.pos, 15, 32); hero.vel.y = 8; hero.onGround = false; }
}
function shockwave(pos, R, P) {
  for (const e of everyone) {
    if (e.state === 'gone' || e.state === 'held') continue;
    const dx = e.c.x - pos.x, dz = e.c.z - pos.z, d = Math.hypot(dx, dz);
    if (d > R || Math.abs(e.c.y - pos.y) > 8) continue;
    const f = 1 - (d / R) * 0.6, m = e.kind === 'car' ? 0.6 : 1;
    const nx = d > 0.01 ? dx / d : rand(-1, 1), nz = d > 0.01 ? dz / d : rand(-1, 1);
    launch(e, new THREE.Vector3(nx * P * f * m, P * 0.75 * f * m, nz * P * f * m));
  }
  ring(pos, R, 0xffd27a, 0.6);
  ring(pos, R * 0.6, 0xffffff, 0.45);
  burst(pos.clone().add(_v.set(0, 0.3, 0)), 50, 0xb8a98f, 22, 0.4, 25, 0.9);
  popup(pos, 'KA-BOOM!', '#ff9800', 1.4);
  shake = Math.max(shake, 1);
  sfx.boom();
}

function grab() {
  if (state !== 'play' || hero.blitz) return;
  if (hero.held) { throwHeld(); return; }
  let best = null, bd = 5.5;
  for (const e of everyone) {
    if (e.state === 'gone' || e.state === 'held' || (e.state === 'fly' && e.vel.length() > 10)) continue;
    const d = Math.hypot(e.c.x - hero.pos.x, e.c.z - hero.pos.z);
    if (d < bd && Math.abs(e.c.y - hero.pos.y - 1) < 3) { bd = d; best = e; }
  }
  if (!best) return;
  if (best.kind === 'person' && !best.counted) { best.counted = true; addKO(best.c, best.cop); }
  if (best.kind === 'car' && ACTIVE.has(best.state)) { carsSmashed++; addHeat(best.police ? 3 : 0.5); }
  best.state = 'held';
  hero.held = best;
  popup(best.c, best.kind === 'car' ? 'SUPER STRENGTH!' : 'GOTCHA!', '#c9a0ff', 0.7);
  sfx.thud();
}
function throwHeld() {
  const e = hero.held;
  hero.held = null;
  const f = camera.getWorldDirection(new THREE.Vector3());
  e.state = 'fly'; e.grounded = false;
  const carry = Math.min(1, 60 / (Math.hypot(hero.vel.x, hero.vel.z) || 1));
  e.vel.copy(f).multiplyScalar(70).add(_v.set(hero.vel.x * carry, 8 + hero.vel.y * 0.5, hero.vel.z * carry));
  e.w.set(rand(-1, 1), rand(-1, 1), rand(-1, 1)).normalize().multiplyScalar(e.kind === 'car' ? 4 : 12);
  if (e.kind === 'car') e.thrown = true;
  sfx.whoosh();
  ring(e.c, 2, 0xffffff, 0.3);
}

function heroInput() {
  let mx = 0, mz = 0;
  if (keys.KeyW || keys.ArrowUp) mz += 1;
  if (keys.KeyS || keys.ArrowDown) mz -= 1;

function updateHero(dt) {

function stepBody(e, dt) {

function syncPeople() {

function updateCamera(dt) {

  const mf = clamp((hs - SPRINT_SPEED) / (MAX_SPEED - SPRINT_SPEED), 0, 1);

    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);

function bar(x, y, w, h, k, col, label) {
  g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(x, y, w, h);
  g.fillStyle = col; g.fillRect(x + 2, y + 2, (w - 4) * clamp(k, 0, 1), h - 4);
  g.fillStyle = '#fff'; g.font = 'bold 12px system-ui, sans-serif'; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText(label, x + 6, y + h / 2 + 0.5);
}
function touchButtons() {
  const r = Math.min(W, H) * 0.075, bx = W - r * 1.7, by = H - r * 1.7;
  return [
    { id: 'punch', label: 'PUNCH', x: bx, y: by, r: r * 1.3, col: '#ff5252' },
    { id: 'blitz', label: 'BLITZ', x: bx - r * 2.8, y: by + r * 0.25, r, col: '#ffd23f' },
    { id: 'jump', label: 'JUMP', x: bx - r * 0.2, y: by - r * 2.8, r, col: '#66ccff' },
    { id: 'freeze', label: 'FREEZE', x: bx - r * 2.6, y: by - r * 2.3, r, col: '#9ef0ff' },
    { id: 'slam', label: 'SLAM', x: bx - r * 5.1, y: by + r * 0.4, r: r * 0.85, col: '#ffa040' },
    { id: 'grab', label: 'GRAB', x: bx - r * 0.1, y: by - r * 5.1, r: r * 0.85, col: '#c9a0ff' },

function drawHud(dt) {
  g.setTransform(hudDPR, 0, 0, hudDPR, 0, 0);

      g.fillText(`GRAPHICS: ${Q.label}  (click to change)`, qb.x + qb.w / 2, qb.y + qb.h / 2);
      g.font = '12px system-ui, sans-serif'; g.fillStyle = '#bcd';

    } else if (state === 'busted') {

    } else comicText('PAUSED', W / 2, H * 0.38, s * 0.8, '#ffffff');
    if (Math.sin(clock * 5) > -0.3) comicText(state === 'busted' ? (IS_TOUCH ? 'TAP TO PLAY AGAIN' : 'CLICK TO PLAY AGAIN') : (IS_TOUCH ? 'TAP TO PLAY' : 'CLICK TO PLAY'), W / 2, H * 0.8, s * 0.38, '#7cf');

  const hs = Math.hypot(hero.vel.x, hero.vel.z), mph = hero.blitz ? 999 : Math.round(hs * MPH);
  const sf = clamp((hs - WALK_SPEED) / (SPRINT_SPEED - WALK_SPEED), 0, 1);

  // speed lines
  if (sf > 0.25 || hero.blitz) {
    const k = hero.blitz ? 1 : (sf - 0.25) / 0.75;
    g.strokeStyle = frozen ? `rgba(180,240,255,${0.5 * k})` : `rgba(255,255,255,${0.45 * k})`;
    g.lineWidth = 2;
    g.beginPath();
    for (let i = 0; i < 40 * k; i++) {
      const a = Math.random() * TAU, r0 = Math.max(W, H) * rand(0.3, 0.45), r1 = r0 + rand(60, 200);
      g.moveTo(W / 2 + Math.cos(a) * r0, H / 2 + Math.sin(a) * r0);

  }
  // wanted stars
  for (let i = 0; i < 5; i++) {
    const on = i < stars, flash = starFlash > 0 && Math.sin(clock * 20) > 0;
    drawStar(W / 2 + (i - 2) * 34, 32, 14, on ? (flash ? '#ffffff' : '#ffd23f') : 'rgba(0,0,0,0.35)');
  }
  if (blastFlash > 0) {
    g.fillStyle = `rgba(255,190,90,${blastFlash})`;
    g.fillRect(0, 0, W, H);
  }
  // police markers
  for (const c of police) {
    if (c.state !== 'chase' && c.state !== 'parked') continue;

    if (!sp || sp[0] < 0 || sp[0] > W || sp[1] < 0 || sp[1] > H) continue;
    g.fillStyle = Math.sin(clock * 14) > 0 ? '#ff3030' : '#3070ff';
    g.beginPath(); g.moveTo(sp[0], sp[1]); g.lineTo(sp[0] - 7, sp[1] - 12); g.lineTo(sp[0] + 7, sp[1] - 12); g.fill();
  }

  // aim target bracket
  const tgt = !hero.held && !hero.blitz ? aimTarget() : null;
  if (tgt) {
    const sp = toScreen(tgt.c.x, tgt.c.y + (tgt.kind === 'car' ? 0.2 : 0), tgt.c.z);
    if (sp) {
      const r = clamp(600 / Math.max(3, tgt.c.distanceTo(camera.position)), 14, 60);
      g.strokeStyle = '#ff5252'; g.lineWidth = 3;
      const c = r * 0.4;
      g.beginPath();
      for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
        const x = sp[0] + sx * r, y = sp[1] + sy * r;
        g.moveTo(x, y - sy * c); g.lineTo(x, y); g.lineTo(x - sx * c, y);
      }
      g.stroke();
      if (tgt.kind === 'car' && !tgt.exploded) {
        for (let i = 0; i < CAR_HITS; i++) {
          const x = sp[0] + (i - (CAR_HITS - 1) / 2) * 16 - 6, y = sp[1] - r - 16;
          g.fillStyle = i < tgt.dmg ? '#ff7a00' : 'rgba(0,0,0,0.45)';
          g.fillRect(x, y, 12, 8);
          g.strokeStyle = '#111'; g.lineWidth = 1.5; g.strokeRect(x, y, 12, 8);
        }
      }
    }
  }
  // crosshair
  g.fillStyle = tgt ? '#ff5252' : '#ffffff';
  g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = 2;
  g.beginPath(); g.arc(W / 2, H / 2, 4, 0, TAU); g.fill(); g.stroke();

  // popups
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.t += dt;
    if (p.t > p.life) { popups.splice(i, 1); continue; }
    const sp = toScreen(p.x, p.y + p.t * 1.5, p.z);
    if (!sp) continue;
    const k = p.t / p.life, pop = k < 0.15 ? k / 0.15 * 1.3 : 1.3 - Math.min(0.3, (k - 0.15) * 1.5);
    const dist = Math.max(4, Math.hypot(p.x - camera.position.x, p.y - camera.position.y, p.z - camera.position.z));
    const size = clamp(420 / dist, 14, 54) * p.size * pop;
    g.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
    comicText(p.text, sp[0], sp[1], size, p.col, p.rot);
    g.globalAlpha = 1;
  }

  // score
  comicText(`KOs: ${kos}`, 90, 34, 30, '#ffd23f');
  g.font = 'bold 14px system-ui, sans-serif'; g.textAlign = 'left'; g.fillStyle = '#fff';
  g.fillText(`Cars smashed: ${carsSmashed}   Best combo: ${bestCombo}`, 16, 66);
  if (clock - lastKO < 2.5 && combo >= 2) {
    const size = 24 + Math.min(combo, 20);
    g.font = `900 ${size}px "Arial Black", Impact, system-ui, sans-serif`;
    comicText(`x${combo} COMBO`, 22 + g.measureText(`x${combo} COMBO`).width / 2, 98, size, '#ff5ac8', -0.06);
  }

  // speedometer
  const sx = W / 2, sy = H - (IS_TOUCH ? 40 : 58), R = 52;
  g.lineWidth = 10; g.lineCap = 'round';
  g.strokeStyle = 'rgba(0,0,0,0.45)';
  g.beginPath(); g.arc(sx, sy, R, Math.PI * 0.85, Math.PI * 2.15); g.stroke();
  const k = clamp(hs / MAX_SPEED, 0, 1), mach = hs / MACH;
  g.strokeStyle = hero.blitz ? '#fff27a' : k > 0.85 ? '#ff5252' : k > 0.5 ? '#ffb300' : '#4fc3f7';
  g.beginPath(); g.arc(sx, sy, R, Math.PI * 0.85, Math.PI * (0.85 + 1.3 * (hero.blitz ? 1 : k))); g.stroke();
  g.lineCap = 'butt';
  comicText(hero.blitz ? 'BLITZ' : `${mph}`, sx, sy - 6, hero.blitz ? 22 : 30, '#ffffff');
  g.font = 'bold 12px system-ui, sans-serif'; g.textAlign = 'center'; g.fillStyle = '#fff';
  g.fillText(mach >= 0.8 ? `MPH · MACH ${mach.toFixed(1)}` : 'MPH', sx, sy + 18);

  // power bars
  const bx = 16, by = IS_TOUCH ? 150 : H - 92;
  bar(bx, by - 26, 190, 20, hero.hp / 100, hero.hp < 30 ? '#ff4040' : '#4caf50', `HEALTH  ${Math.ceil(hero.hp)}`);
  bar(bx, by, 190, 20, freezeE / FREEZE_MAX, frozen ? '#9ef0ff' : '#3fa9d6', IS_TOUCH ? 'FREEZE' : 'FREEZE TIME  [F]');
  bar(bx, by + 26, 190, 20, hero.blitzCd > 0 ? 1 - hero.blitzCd / 3.5 : 1, hero.blitzCd > 0 ? '#9c8a3a' : '#ffd23f', IS_TOUCH ? 'BLITZ' : 'SPEED BLITZ  [RIGHT CLICK]');
  bar(bx, by + 52, 190, 20, hero.slamCd > 0 ? 1 - hero.slamCd / 1.2 : 1, '#ff9a40', IS_TOUCH ? 'SLAM' : 'GROUND SLAM  [E]');

  if (showHelp && !IS_TOUCH) {
    const lines = ['WASD  move', 'SHIFT  speed (Mach 3)', 'SPACE  jump x2', 'LEFT CLICK  punch', 'RIGHT CLICK  blitz', 'F  freeze time', 'E  ground slam', 'G  grab / throw', 'P  FPS meter', 'H  hide help'];
    g.fillStyle = 'rgba(0,0,0,0.4)'; g.fillRect(W - 178, 12, 166, lines.length * 18 + 12);
    g.font = '12px system-ui, sans-serif'; g.fillStyle = '#fff'; g.textAlign = 'left';
    lines.forEach((l, i) => g.fillText(l, W - 168, 30 + i * 18));
  }

  if (IS_TOUCH) {
    for (const b of touchButtons()) {
      const on = b.id === 'boost' ? touch.boost : b.id === 'freeze' ? frozen : false;
      g.globalAlpha = 0.75;
      g.fillStyle = on ? b.col : 'rgba(0,0,0,0.35)';
      g.strokeStyle = b.col; g.lineWidth = 3;
      g.beginPath(); g.arc(b.x, b.y, b.r, 0, TAU); g.fill(); g.stroke();
      g.globalAlpha = 1;
      g.font = `bold ${Math.round(b.r * 0.32)}px system-ui, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = on ? '#111' : '#fff';
      g.fillText(b.label, b.x, b.y);
    }
    if (touch.joy) {
      const j = touch.joy;
      g.strokeStyle = 'rgba(255,255,255,0.5)'; g.lineWidth = 3;
      g.beginPath(); g.arc(j.x0, j.y0, j.r, 0, TAU); g.stroke();
      g.fillStyle = 'rgba(255,255,255,0.5)';
      g.beginPath(); g.arc(j.x0 + j.vx * j.r, j.y0 + j.vy * j.r, j.r * 0.4, 0, TAU); g.fill();
    }
  }
}

// =====================================================================
// Input
// =====================================================================
function startPlay() {
  audioInit();
  state = 'play';
  if (!IS_TOUCH && hud.requestPointerLock) {
    try { const r = hud.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (e) { /* no pointer lock */ }
  }
}
function hitQualityButton(x, y) {
  if (state !== 'title') return false;
  const b = qualityButton();
  if (x < b.x || x > b.x + b.w || y < b.y || y > b.y + b.h) return false;
  setQuality(QUALITY_ORDER[(QUALITY_ORDER.indexOf(qualityKey) + 1) % QUALITY_ORDER.length]);
  return true;
}
function tryStart() {
  if (state === 'busted') {
    if (clock - bustedAt < 1.5) return;
    resetGame();
  }
  startPlay();
}
hud.addEventListener('click', e => { if (state !== 'play' && !IS_TOUCH && !hitQualityButton(e.clientX, e.clientY)) tryStart(); });
document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement !== hud && state === 'play' && !IS_TOUCH && !PARAMS.has('test')) { state = 'paused'; keys.ShiftLeft = keys.ShiftRight = false; mouseHeld = false; }
});
hud.addEventListener('contextmenu', e => e.preventDefault());
hud.addEventListener('mousedown', e => {
  if (document.pointerLockElement !== hud || state !== 'play') return;
  if (e.button === 0) { mouseHeld = true; punch(); }
  if (e.button === 2) startBlitz();
});
addEventListener('mouseup', e => { if (e.button === 0) mouseHeld = false; });
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement !== hud || state !== 'play') return;
  camYaw -= e.movementX * 0.0024;
  camPitch = clamp(camPitch - e.movementY * 0.0024, -1.25, 0.9);
});
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  if (state !== 'play' || e.repeat) return;
  switch (e.code) {
    case 'Space': jump(); break;
    case 'KeyF': toggleFreeze(); break;
    case 'KeyE': slam(); break;
    case 'KeyG': grab(); break;
    case 'KeyQ': startBlitz(); break;
    case 'KeyH': showHelp = !showHelp; break;
    case 'KeyP': perf.show = !perf.show; break;
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouseHeld = false; });

function touchAction(id) {
  switch (id) {
    case 'punch': punch(); break;
    case 'blitz': startBlitz(); break;
    case 'jump': jump(); break;
    case 'freeze': toggleFreeze(); break;
    case 'slam': slam(); break;
    case 'grab': grab(); break;
    case 'boost': touch.boost = !touch.boost; break;
  }
}
hud.addEventListener('touchstart', e => {
  e.preventDefault();
  audioInit();
  if (state !== 'play') { const t0 = e.changedTouches[0]; if (!hitQualityButton(t0.clientX, t0.clientY)) tryStart(); return; }
  for (const t of e.changedTouches) {
    const x = t.clientX, y = t.clientY;
    const b = touchButtons().find(b => Math.hypot(x - b.x, y - b.y) < b.r * 1.1);
    if (b) { touchAction(b.id); if (b.id === 'punch') touch.punchId = t.identifier; continue; }
    if (x < W * 0.4 && y > H * 0.35 && !touch.joy) touch.joy = { id: t.identifier, x0: x, y0: y, vx: 0, vy: 0, r: Math.min(W, H) * 0.11 };
    else if (!touch.look) touch.look = { id: t.identifier, x, y };
  }
}, { passive: false });
hud.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (touch.joy && t.identifier === touch.joy.id) {
      const j = touch.joy;
      let vx = (t.clientX - j.x0) / j.r, vy = (t.clientY - j.y0) / j.r;
      const l = Math.hypot(vx, vy);
      if (l > 1) { vx /= l; vy /= l; }
      j.vx = vx; j.vy = vy;
    } else if (touch.look && t.identifier === touch.look.id) {
      camYaw -= (t.clientX - touch.look.x) * 0.006;
      camPitch = clamp(camPitch - (t.clientY - touch.look.y) * 0.006, -1.25, 0.9);
      touch.look.x = t.clientX; touch.look.y = t.clientY;
    }
  }
}, { passive: false });
function touchEnd(e) {
  for (const t of e.changedTouches) {
    if (touch.joy && t.identifier === touch.joy.id) touch.joy = null;
    if (touch.look && t.identifier === touch.look.id) touch.look = null;
    if (t.identifier === touch.punchId) touch.punchId = null;
  }
}
hud.addEventListener('touchend', touchEnd);
hud.addEventListener('touchcancel', touchEnd);

// ?test runs a scripted hero so headless runs exercise every power
let testT = 0;
function testDriver(dt) {
  testT += dt;
testDriver.top = Math.max(testDriver.top || 0, Math.hypot(hero.vel.x, hero.vel.z) * MPH);
  if (!PARAMS.has('bench') && !PARAMS.has('boom') && !document.title.startsWith('ERR')) document.title = `T${testT.toFixed(1)} topMph${Math.round(testDriver.top)} x${Math.round(hero.pos.x)} z${Math.round(hero.pos.z)} KO${kos} CARS${carsSmashed} stars${stars} cops${people.filter(p => p.state === 'chase').length} police${police.filter(c => c.state === 'chase' || c.state === 'parked').length} hp${Math.round(hero.hp)} burning${cars.filter(c => c.exploded && c.state !== 'gone').length}`;
  if (PARAMS.has('boom')) { // hit one car three times beside an already-damaged car to check chain reactions
    const a = cars[0], b = cars[1];
    if (testT < 0.05) {
      for (const [car, x] of [[a, 6], [b, 10]]) { car.state = 'wreck'; car.t = 99; car.c.set(x, CAR_HALF, 3); car.vel.set(0, 0, 0); }
      b.dmg = 2;
    }
    if (a.dmg < 3 && !a.exploded && testT > 0.3 * (a.dmg + 1)) launch(a, new THREE.Vector3(0, 6, 0));
    if (a.exploded) testDriver.aBoom = testDriver.aBoom || testT.toFixed(2);
    if (b.exploded) testDriver.bBoom = testDriver.bBoom || testT.toFixed(2);
    if (!document.title.startsWith('ERR')) document.title = `T${testT.toFixed(1)} carA exploded at ${testDriver.aBoom} carB exploded at ${testDriver.bBoom} hp${Math.round(hero.hp)}`;
    return;
  }
  if (PARAMS.has('mach')) { // straight run from outside town toward the center: reach Mach 3, then hit the city
    if (testT < 0.05) { hero.pos.set(HALF + 1900, 0, gridLine(4) + CELL / 2); camYaw = -Math.PI / 2; camPitch = 0; }
    keys.KeyW = true; keys.ShiftLeft = true;
    testDriver.top = Math.max(testDriver.top || 0, Math.hypot(hero.vel.x, hero.vel.z) * MPH);
    const b = findBuilding(hero.pos.x, hero.pos.z, 0);
    if (b && hero.pos.y < b.h - 0.6) testDriver.inside = (testDriver.inside || 0) + 1;
    if (!document.title.startsWith('ERR')) document.title = `T${testT.toFixed(1)} topMph${Math.round(testDriver.top)} nowMph${Math.round(Math.hypot(hero.vel.x, hero.vel.z) * MPH)} x${Math.round(hero.pos.x)} insideBuilding${testDriver.inside || 0}`;
    return;
  }
  if (PARAMS.has('still')) { // stand still after a rampage so the police can arrive
    if (testT < 4) { heat = 40; return; }
    camYaw += dt * 0.2;
    return;
  }
  keys.KeyW = true;
  keys.ShiftLeft = testT % 6 < 3;
  camYaw += dt * 0.3;
  const step = Math.floor(testT * 2) % 12;
  if (step === 0) punch();
  if (step === 3) startBlitz();
  if (step === 5 && !frozen && Math.floor(testT) % 8 === 2) toggleFreeze();
  if (step === 7 && frozen) toggleFreeze();
  if (step === 8) jump();
  if (step === 9) slam();
  if (step === 10) grab();
  if (step === 11 && hero.held) punch();
}

// =====================================================================
// Main loop
// =====================================================================
function stepPlay(dt) {
  if (PARAMS.has('test')) testDriver(dt);
  if (mouseHeld || touch.punchId != null) punch();
  if (frozen) {
    freezeE -= 9 * dt;
    if (freezeE <= 0) { freezeE = 0; frozen = false; sfx.unfreeze(); }
  } else freezeE = Math.min(FREEZE_MAX, freezeE + 5 * dt);
  const wdt = frozen ? 0 : dt;
  updateHero(dt);
  if (state !== 'play') return;
  updatePolice(wdt);
  updatePeople(wdt);
  updateCars(wdt);
  updateParticles(wdt);
  updateFireballs(wdt);
}

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const raw = Math.max(0, (now - last) / 1000), dt = Math.min(0.066, raw);
  last = now;
  const t0 = performance.now();
  // lower the render resolution if the game keeps running slowly
  if (state === 'play' && !PARAMS.has('test') && raw < 0.5) {
    slowT = raw > 1 / 42 ? slowT + raw : Math.max(0, slowT - raw * 0.5);
    if (slowT > 2 && dprCap > 0.6) {
      dprCap = Math.max(0.6, dprCap - 0.2);
      slowT = 0;
      resize();
      if (dprCap <= 1 && sun.shadow.mapSize.x > 1024) {
        sun.shadow.mapSize.set(1024, 1024);
        if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
      }
    }
  }
  clock += dt;
  if (state === 'play') {
    // split long frames into smaller steps so the game keeps its real speed when the frame rate drops;
    // ?test simulates many steps per rendered frame, since headless browsers render slowly
    const n = PARAMS.has('test') && !PARAMS.has('bench') ? 150 : dt > 0.034 ? 2 : 1;
    for (let i = n; i > 0 && state === 'play'; i--) stepPlay(PARAMS.has('test') ? Math.min(dt, 0.033) : dt / n);
  } else if (state === 'title') {
    updatePeople(dt);
    updateCars(dt);
    updateParticles(dt);
  }
  updateRings(dt);
  updateBolts(dt);
  const hs = Math.hypot(hero.vel.x, hero.vel.z);
  updateTrail(state === 'play' && (hs > 25 || !!hero.blitz));
  syncHero(state === 'play' ? dt : 0);
  updateVapor();
  syncPeople();
  updateCamera(dt);
  // frozen time tints the lights and sky icy blue (cheaper than a CSS filter on the canvas)
  freezeMix = approach(freezeMix, frozen && state === 'play' ? 1 : 0, dt * 4);
  hemi.color.copy(HEMI_SKY).lerp(ICE_SKY, freezeMix);
  hemi.groundColor.copy(HEMI_GROUND).lerp(ICE_GROUND, freezeMix);
  sun.color.copy(SUN_COL).lerp(ICE_SUN, freezeMix);
  sun.intensity = lerp(2.1, 1.2, freezeMix);
  scene.fog.color.copy(HORIZON).lerp(ICE_FOG, freezeMix);
  sky.material.uniforms.bot.value.copy(scene.fog.color);
  sky.material.uniforms.top.value.copy(SKY_TOP).lerp(ICE_TOP, freezeMix);
  hurtFlash = Math.max(0, hurtFlash - dt);
  starFlash = Math.max(0, starFlash - dt);
  blastFlash = Math.max(0, blastFlash - dt * 1.5);
  let near = Infinity;
  for (const c of police) if (c.state === 'chase' || c.state === 'parked') near = Math.min(near, c.c.distanceTo(hero.pos));
  if (sirenGain) {
    sirenGain.gain.value = state === 'play' && !frozen ? clamp(1 - near / 200, 0, 1) * 0.06 : 0;
    siren.frequency.value = 760 + 220 * Math.sin(clock * 4.5);
  }
  if (windGain) windGain.gain.value = state === 'play' ? clamp((hs - 15) / 75, 0, 1) * 0.35 : 0;

  sky.position.copy(camera.position);
  sun.position.set(hero.pos.x + 70, hero.pos.y + 120, hero.pos.z + 45);
  sun.target.position.copy(hero.pos);
  const t1 = performance.now();
  renderer.render(scene, camera);
  const t2 = performance.now();
  drawHud(dt);
  const t3 = performance.now();
  perf.sJs += t1 - t0; perf.sGpu += t2 - t1; perf.sHud += t3 - t2;
  perf.frames++; perf.acc += raw;
  if (perf.acc >= 0.5) {
    perf.fps = perf.frames / perf.acc;
    perf.js = perf.sJs / perf.frames; perf.gpu = perf.sGpu / perf.frames; perf.hud = perf.sHud / perf.frames;
    perf.frames = perf.acc = perf.sJs = perf.sGpu = perf.sHud = 0;
    if (PARAMS.has('bench')) document.title = `fps${perf.fps.toFixed(0)} js${perf.js.toFixed(2)} render${perf.gpu.toFixed(2)} hud${perf.hud.toFixed(2)} calls${renderer.info.render.calls} tris${renderer.info.render.triangles}`;
  }
  if (perf.show) {
    const lines = [
      `${perf.fps.toFixed(0)} FPS   (${qualityKey}, ${Math.round(W * DPR)}x${Math.round(H * DPR)})`,
      `game ${perf.js.toFixed(1)}ms  draw ${perf.gpu.toFixed(1)}ms  hud ${perf.hud.toFixed(1)}ms`,
      `${renderer.info.render.calls} draw calls  ${(renderer.info.render.triangles / 1000).toFixed(0)}k triangles`,
    ];
    g.setTransform(hudDPR, 0, 0, hudDPR, 0, 0);
    g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(W - 300, H - 70, 290, 60);
    g.font = '12px ui-monospace, monospace'; g.fillStyle = perf.fps < 40 ? '#ff8080' : '#80ff9a'; g.textAlign = 'left'; g.textBaseline = 'middle';
    lines.forEach((l, i) => g.fillText(l, W - 292, H - 56 + i * 17));
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
